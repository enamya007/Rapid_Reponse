  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U ticket_checker -d ticket_checker']
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Host port shifted to 6380 (Redis' default is 6379), same reasoning as
    # Postgres' 5434: avoid clashing with a Redis instance already running
    # locally for another project.
    ports:
      - '6380:6379'
    volumes:
      - ticket-checker-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin12345
    # Host ports shifted to 9002 (API, default 9000) / 9003 (console, default
    # 9001), same reasoning as Postgres' 5434: avoid clashing with other local
    # dev tooling that commonly squats on 9000/9001.
    ports:
      - '9002:9000'
      - '9003:9001'
    volumes:
      - ticket-checker-miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot job: creates the application bucket if it doesn't exist yet, then
  # exits. Talks to `minio` over the internal compose network (not the
  # host-mapped 9002 port), so it only needs to wait on minio's own healthcheck.
  minio-init:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin12345 &&
      mc mb --ignore-existing local/ticket-checker-attachments
      "

  # Local SMTP catch-all for development (P6): accepts mail on 1025 with no
  # authentication and exposes a web UI + HTTP API on 8025 to inspect what was
  # "sent". No volume: development mail is disposable, nothing worth
  # persisting across restarts.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # UI web + HTTP API
    # The image ships its own `/mailpit readyz` binary subcommand for exactly
    # this purpose (verified locally, not guessed); declared explicitly here
    # to match the redis/minio services above.
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # ticket-checker-pgdata:
  ticket-checker-redisdata:
  ticket-checker-miniodata:
