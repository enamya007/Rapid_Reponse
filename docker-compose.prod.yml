# Production stack: Postgres + a one-shot migration runner + the API.
#
# Usage (pull the published image):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Usage (build locally instead of pulling): uncomment the `build:` block under
# the `api` service below, then run:
#   docker compose -f docker-compose.prod.yml --env-file .env.production build api
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# All application configuration (DB credentials, JWT secrets, CORS, ...) is
# supplied via `.env.production` (see .env.production.example). Copy that file,
# fill in real secrets, and never commit the result.

# Pinned explicitly: without it, Compose derives the project name from the
# directory (here, the same directory as docker-compose.yml), so this stack
# and the dev one would share a namespace and Compose would treat their same-
# named "postgres" service as one and the same -- recreating (i.e. destroying)
# whichever container started first. Keep this name distinct from dev's.
name: ticket-checker-prod

services:
  # postgres:
  #   image: postgres:17-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${DB_USERNAME}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     POSTGRES_DB: ${DB_NAME}
  #   # No `ports:` mapping on purpose: the database must only be reachable from
  #   # other containers on this compose's internal network, never from the
  #   # host/internet. Note that a `"${VAR:-}:5432"` style toggle does NOT
  #   # achieve this safely -- Docker treats an empty host-port as "publish on a
  #   # random host port", not "don't publish", which would silently expose the
  #   # DB. For one-off access (psql, backups, ...) use
  #   # `docker compose -f docker-compose.prod.yml exec postgres psql -U ... `
  #   # instead of publishing the port.
  #   volumes:
  #     - ticket-checker-prod-pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `--requirepass` degrades to "no auth" if REDIS_PASSWORD is unset, but
    # this stack is not exposed on the host on purpose (see the `postgres`
    # comment above) -- REDIS_PASSWORD must still always be set in
    # `.env.production` in practice, since any other container that later
    # joins this compose's network could otherwise reach Redis unauthenticated.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    # No `ports:` mapping on purpose, same reasoning as `postgres` above: only
    # reachable from other containers on this compose's internal network.
    volumes:
      - ticket-checker-prod-redisdata:/data
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_PASSWORD}',
          '--no-auth-warning',
          'ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # minio:
  #   image: minio/minio:latest
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     # Mapped 1:1 to the app's own S3 credentials: MinIO's root user/password
  #     # doubles as the S3 access/secret key pair the app authenticates with.
  #     MINIO_ROOT_USER: ${S3_ACCESS_KEY}
  #     MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
  #   # No `ports:` mapping on purpose, same reasoning as `postgres` above: only
  #   # reachable from other containers on this compose's internal network. For
  #   # one-off console access, temporarily publish 9001 (or use an SSH tunnel)
  #   # instead of exposing it by default.
  #   volumes:
  #     - ticket-checker-prod-miniodata:/data
  #   healthcheck:
  #     test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  # One-shot job: creates the application bucket if it doesn't exist yet, then
  # exits. Talks to `minio` over the internal compose network only.
  minio-init:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      # minio:
      #   condition: service_healthy
    env_file:
      - .env.production
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://$$S3_ENDPOINT:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" &&
      mc mb --ignore-existing \"local/$$S3_BUCKET\"
      "

  # Runs the pending TypeORM migrations once, then exits. Kept as its own
  # service (instead of running migrations from the app's entrypoint) so that
  # scaling `api` to several replicas never races multiple containers running
  # migrations against the same database at boot.
  migrate:
    image: ${API_IMAGE:-ghcr.io/student-api-iai/enamya-ticket-checker:latest}
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    command: ['npm', 'run', 'migration:run:prod']
    restart: 'no'
    depends_on:
      # postgres:
      #   condition: service_healthy
    env_file:
      - .env.production

  api:
    image: ${API_IMAGE:-ghcr.io/student-api-iai/enamya-ticket-checker:latest}
    # Uncomment to build from source instead of pulling the published image
    # (also uncomment the same block in `migrate` above, and pass
    # `--build` to `docker compose up`):
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      # postgres:
      #   condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  # ticket-checker-prod-pgdata:
  ticket-checker-prod-redisdata:
  # ticket-checker-prod-miniodata:
